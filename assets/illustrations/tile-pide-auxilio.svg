<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -2 128 118" width="256" height="236" role="img" aria-hidden="true">
  <defs>
    <!-- Recorte transparente para el brillo de la sirena -->
    <mask id="brillo">
      <rect x="0" y="40" width="120" height="50" fill="#FFFFFF"/>
      <rect x="46" y="62" width="8" height="14" rx="4" fill="#000000"/>
    </mask>
  </defs>

  <!-- Ondas de ubicación -->
  <ellipse cx="60" cy="108" rx="34" ry="7" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>
  <ellipse cx="60" cy="108" rx="20" ry="4.5" fill="#FFFFFF" fill-opacity="0.28"/>

  <!-- Destellos amarillos (mismo trazo que el logo y el ícono de "Cerca de ti") -->
  <g stroke="#FFC93C" stroke-width="6" stroke-linecap="round">
    <line x1="60" y1="45" x2="60" y2="33"/>
    <line x1="81.2" y1="51.7" x2="88.1" y2="41.9"/>
    <line x1="38.8" y1="51.7" x2="31.9" y2="41.9"/>
    <line x1="94.8" y1="69.3" x2="106" y2="65.2"/>
    <line x1="25.2" y1="69.3" x2="14" y2="65.2"/>
  </g>

  <!-- Sirena: cúpula + base -->
  <path d="M32 82 A28 28 0 0 1 88 82 Z" fill="#FFFFFF" mask="url(#brillo)"/>
  <rect x="24" y="86" width="72" height="14" rx="6" fill="#FFFFFF"/>
</svg>
